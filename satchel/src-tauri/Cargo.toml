[package]
name = "satchel"
version = "0.1.0"
description = "Satchel: a second brain for school"
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue #8519 on Windows).
name = "satchel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.43", features = ["bundled"] }
# native-tls = SChannel on Windows: no CMake/NASM build deps, uses the Windows cert store.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "charset", "system-proxy"] }
keyring-core = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
fastrand = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# API key lives in Windows Credential Manager.
windows-native-keyring-store = { version = "1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
